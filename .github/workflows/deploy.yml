name: Deploy to cPouta

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPOUTA_HOST }}
          username: ${{ secrets.CPOUTA_USER }}
          key: ${{ secrets.CPOUTA_SSH_KEY }}
          script: |
            cd ~/task-tracker
            git pull
            docker compose up --build -d
